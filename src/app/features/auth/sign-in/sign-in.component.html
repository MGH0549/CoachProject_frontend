<h1>تسجيل الدخول</h1>
<p class="intro">أهلاً بعودتك. حان وقت التمرين.</p>
<form class="form-stack" [formGroup]="form" (ngSubmit)="submit()">
  <label class="field"
    >البريد الإلكتروني<input
      type="email"
      formControlName="email"
      autocomplete="email"
      dir="ltr"
      placeholder="you@email.com" /></label
  ><label class="field"
    >كلمة المرور<input
      type="password"
      formControlName="password"
      autocomplete="current-password"
      placeholder="كلمة المرور"
  /></label>
  @if (form.touched && form.invalid) {
    <p class="error">أدخل بريدك الإلكتروني وكلمة المرور.</p>
  }
  <a class="link caption" routerLink="/auth/forgot-password">نسيت كلمة المرور؟</a>
  @if (error()) {
    <p class="error" role="alert">{{ error() }}</p>
  }
  <button class="btn full" [disabled]="busy()">
    {{ busy() ? 'جارٍ تسجيل الدخول…' : 'تسجيل الدخول' }}
  </button>
</form>
<p class="footer">ليس لديك حساب؟ <a class="link" routerLink="/auth/register">أنشئ حسابك</a></p>
