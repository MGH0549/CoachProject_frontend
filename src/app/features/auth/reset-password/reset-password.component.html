<h1>كلمة مرور جديدة</h1>
<p class="intro">اختر كلمة مرور قوية لحسابك.</p>
@if (done()) {
  <div class="card">
    <p class="success" role="status">تم تغيير كلمة المرور. يمكنك الآن تسجيل الدخول.</p>
    <a class="btn full" routerLink="/auth/sign-in">تسجيل الدخول</a>
  </div>
} @else if (!token) {
  <p class="error">الرابط غير مكتمل.</p>
  <a class="text-button" routerLink="/auth/forgot-password">طلب رابط جديد</a>
} @else {
  <form [formGroup]="form" class="form-stack" (ngSubmit)="submit()">
    <label class="field"
      >كلمة المرور الجديدة<input
        type="password"
        autocomplete="new-password"
        formControlName="password" /></label
    ><label class="field"
      >تأكيد كلمة المرور<input
        type="password"
        autocomplete="new-password"
        formControlName="confirm"
    /></label>
    @if (error()) {
      <p class="error" role="alert">{{ error() }}</p>
    }
    <button class="btn full" [disabled]="busy()">
      {{ busy() ? 'جارٍ الحفظ…' : 'حفظ كلمة المرور' }}
    </button>
  </form>
}
